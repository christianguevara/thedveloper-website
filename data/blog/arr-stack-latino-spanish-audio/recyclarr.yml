# yaml-language-server: $schema=https://raw.githubusercontent.com/recyclarr/recyclarr/master/schemas/config-schema.json
radarr:
  movies:
    base_url: http://radarr:7878
    api_key: !secret radarr_api_key
    delete_old_custom_formats: true
    media_naming:
      folder: plex-tmdb
      movie:
        rename: true
        standard: plex-tmdb
    quality_definition:
      type: movie

    quality_profiles:
      - trash_id: 64fb5f9858489bdac2af690e27c8f42f   # UHD Bluray + WEB → Language=Original, guide CFs/scores/groups
        name: Original only
        reset_unmatched_scores:
          enabled: true
        upgrade:
          allowed: true
          until_quality: Bluray-2160p                # cutoff stays 2160p → a 1080p grab is upgraded later
          until_score: 10000                         # (= guide value)
        quality_sort: top
        qualities:                                   # REPLACES the guide list (Recyclarr: config qualities win)
          - name: Bluray-2160p
          - name: WEB 2160p
            qualities: [WEBDL-2160p, WEBRip-2160p]
          - name: Remux-2160p                        # NOT allowed – listed only to keep TRaSH's own rank
            enabled: false                           #   (above 1080p) so a 4K file is never "upgraded" to 1080p
          - name: Remux-1080p
            enabled: false
          - name: Bluray-1080p                       # 1080p fallback when no 2160p exists
          - name: WEB 1080p
            qualities: [WEBDL-1080p, WEBRip-1080p]

      - name: Latino if available                    # user-defined; Recyclarr creates it with Language=Original
        reset_unmatched_scores:
          enabled: true
        min_format_score: 0
        min_upgrade_format_score: 500                # 2026-10-12 ranking alignment: tier/resolution/remux→encode/HDR
                                                     #   steps (>=500) upgrade; sub-tier, repack, streaming noise (<=200) doesn't
        upgrade:
          allowed: true
          until_quality: Latino ladder
          until_score: 20000                         # above the best possible Spanish score (16562) → Spanish keeps upgrading
        quality_sort: top
        qualities:
          - name: Latino ladder                      # ONE group → quality always ties → CF score decides
            qualities:
              - Remux-2160p
              - Bluray-2160p
              - WEBDL-2160p
              - WEBRip-2160p
              - Remux-1080p
              - Bluray-1080p
              - WEBDL-1080p
              - WEBRip-1080p
              - Bluray-720p
              - WEBDL-720p
              - WEBRip-720p

    custom_format_groups:
      add:
        - trash_id: 7fc2751eef7e6bdc70b74136e5e35c76  # [HDR Formats] DV (w/o HDR fallback) → Original only (−10000)

    # (TRaSH default groups — Unwanted incl. LQ −10000, HDR, Golden Rule UHD, Audio, Streaming — are applied
    #  automatically to the guide-backed "Original only"; nothing is skipped: full TRaSH alignment.)

    custom_formats:
      - trash_ids:                                   # HD Bluray tiers for the 1080p fallback (guide default scores)
          - ed27ebfef2f323e964fb1f61391bcb35  # HD Bluray Tier 01
          - c20c8647f2746a1f4c4262b0fbbeeeae  # HD Bluray Tier 02
          - 5608c71bcebba0a5e666223bae8c9227  # HD Bluray Tier 03
        assign_scores_to: [{ name: Original only }, { name: Latino if available }]
      # --- Latino ranking aligned with "Original only" via scores (2026-10-12). Quality must stay ONE group
      #     (Radarr compares quality before CF score), so the UHD Bluray + WEB order is rebuilt from scores:
      #     Bluray-2160p enc > WEB-2160p > Remux-2160p > Bluray-1080p > WEB-1080p, all inside the Spanish band.
      - trash_ids:                                   # guide CFs of UHD Bluray + WEB, guide default scores
          - 4d74ac4c4db0b64bff6ce0cffef99bf0  # UHD Bluray Tier 01 (1800)
          - a58f517a70193f8e578056642178419d  # UHD Bluray Tier 02 (1750)
          - e71939fae578037e7aed3ee219bbe7c1  # UHD Bluray Tier 03 (1700)
          - c20f169ef63c5f40c2def54abaf4438e  # WEB Tier 01 (1700)
          - 403816d65392c79236dcb6dd591aeda4  # WEB Tier 02 (1650)
          - af94e0fe497124d1f9ce732069ec8c3b  # WEB Tier 03 (1600)
          - e7718d7a3ce595f289bfee26adc178f5  # Repack/Proper (5)
          - ae43b294509409a6a13919dedd4764c4  # Repack2 (6)
          - 5caaaa1c08c1742aa4342d8c4cc463f2  # Repack3 (7)
          - 493b6d1dbec3c3364c59d7607f7e3405  # HDR (500) — guide HDR group default; same CF as the old explicit +500
          - cc5e51a9e85a6296ceefe097a77f12f4  # BCORE (15)
          - 16622a6911d1ab5d5b8b713d5b0036d4  # CRiT (20)
          - 2a6039655313bf5dab1e43523b62c374  # MA (20)
        assign_scores_to: [{ name: Latino if available }]
        # NOT assigned on Latino: guide Audio CFs (TrueHD ATMOS 5000 … would favour remux tracks and push the
        # English max toward 10000) and Remux Tier CFs (remux must rank below encodes).
      - trash_ids: [local-audio-spanish]
        assign_scores_to: [{ name: Latino if available, score: 10000 }]
      - trash_ids: [local-res-2160p]                # 1000 → 4000: 2160p−1080p gap must exceed tier 1800 + remux 600
        assign_scores_to: [{ name: Latino if available, score: 4000 }]   #   + Bluray 200 → any 2160p beats any 1080p
      - trash_ids: [local-res-1080p]
        assign_scores_to: [{ name: Latino if available, score: 500 }]
      - trash_ids: [local-latino-bluray-encode]     # Bluray (not remux) > WEB at equal tier status
        assign_scores_to: [{ name: Latino if available, score: 200 }]
      - trash_ids: [local-latino-remux]             # remux below every 2160p encode (even SDR vs HDR remux: 600 > 500)
        assign_scores_to: [{ name: Latino if available, score: -600 }]
      - trash_ids:
          - 90a6f9a284dff5103f6346090e6280c8  # LQ (release group; matches FGT/BTM — soft on purpose)
          - 839bea857ed2c0a8e084f3cbdbd65ecb  # x265 (no HDR/DV)
        assign_scores_to: [{ name: Latino if available, score: -1000 }]
      - trash_ids:
          - ed38b889b31be83fda192888e2286d83  # BR-DISK
          - e204b80c87be9497a8a6eaff48f72905  # LQ (Release Title)
          - b8cd450cbfa689c0259a01d9e29ba3d6  # 3D
          - 0a3f082873eb454bde444150b70253cc  # Extras
          - bfd8eb01832d646a0a89c4deb46f8564  # Upscaled
          - cae4ca30163749b891686f95532519bd  # AV1
          - 712d74cd88bceb883ee32f773656b1f5  # Sing-Along Versions
          - e6886871085226c3da1830830146846c  # Generated Dynamic HDR
          - 923b6abef9b17f937fab56cfcf89e1f1  # DV (w/o HDR fallback)
        assign_scores_to: [{ name: Latino if available, score: -20000 }]

sonarr:
  series:
    base_url: http://sonarr:8989
    api_key: !secret sonarr_api_key
    delete_old_custom_formats: true
    media_naming:
      series: plex-tvdb
      season: default
      episodes:
        rename: true
        standard: default
        daily: default
        anime: default
    quality_definition:
      type: series

    quality_profiles:
      - trash_id: c4cadd6b35b95f62c3d47a408e53e2f7   # WEB-2160p (Combined): WEB 2160p, fallback WEB 1080p
        name: Original only (TV)
        reset_unmatched_scores:
          enabled: true
        upgrade:
          allowed: true
          until_quality: WEB 2160p
          until_score: 10000
        quality_sort: top
        qualities:                                   # = guide list + rank of two NON-allowed 2160p qualities
          - name: WEB 2160p
            qualities: [WEBDL-2160p, WEBRip-2160p]
          - name: Bluray-2160p Remux                 # not allowed; ranked above 1080p so a 4K episode is never
            enabled: false                           #   replaced by WEB-1080p (TRaSH's JSON ranks them below it)
          - name: Bluray-2160p
            enabled: false
          - name: WEB 1080p
            qualities: [WEBDL-1080p, WEBRip-1080p]

      - name: Latino if available (TV)
        reset_unmatched_scores:
          enabled: true
        min_format_score: 0
        min_upgrade_format_score: 500                # see Radarr Latino profile
        upgrade:
          allowed: true
          until_quality: Latino ladder
          until_score: 20000
        quality_sort: top
        qualities:
          - name: Latino ladder
            qualities:
              - Bluray-2160p Remux
              - Bluray-2160p
              - WEBDL-2160p
              - WEBRip-2160p
              - Bluray-1080p Remux
              - Bluray-1080p
              - WEBDL-1080p
              - WEBRip-1080p
              - HDTV-1080p
              - Bluray-720p
              - WEBDL-720p
              - WEBRip-720p
              - HDTV-720p

    custom_format_groups:
      add:
        - trash_id: d776a1ea912a117d66d83b880ff2055d  # [HDR Formats] DV (w/o HDR fallback) → Original only (TV)

    custom_formats:
      - trash_ids: [local-sonarr-audio-spanish]
        assign_scores_to: [{ name: Latino if available (TV), score: 10000 }]
      - trash_ids: [local-sonarr-res-2160p]          # 1000 → 4000 (same reasoning as Radarr)
        assign_scores_to: [{ name: Latino if available (TV), score: 4000 }]
      - trash_ids: [local-sonarr-res-1080p]
        assign_scores_to: [{ name: Latino if available (TV), score: 500 }]
      - trash_ids: [local-sonarr-latino-remux]       # remux below every 2160p encode
        assign_scores_to: [{ name: Latino if available (TV), score: -600 }]
      # --- Latino ranking aligned with "Original only (TV)" = WEB-2160p (Combined) via scores (2026-10-12).
      #     Guide default scores; "Language: Not Original" deliberately NOT assigned (Spanish must never be penalised).
      - trash_ids:
          - e6258996055b9fbab7e9cb2f75819294  # WEB Tier 01 (1700)
          - 58790d4e2fdcd9733aa7ae68ba2bb503  # WEB Tier 02 (1650)
          - d84935abd3f8556dcd51d4f27e22d0a6  # WEB Tier 03 (1600)
          - d0c516558625b04b363fa6c5c2c7cfd4  # WEB Scene (1600)
          - ec8fa7296b64e8cd390a1600981f3923  # Repack/Proper (5)
          - eb3d5cc0a2be0db205fb823640db6a3c  # Repack2 (6)
          - 44e7c4de10ae50265753082e5dc76047  # Repack3 (7)
          - 505d871304820ba7106b693be6fe4a9e  # HDR (500) — guide default; same CF as the old explicit +500
          - d660701077794679fd59e8bdf4ce3a29  # AMZN
          - d9e511921c8cedc7282e291b0209cdc5  # ATV
          - f67c9ca88f463a48346062e8ad07713f  # ATVP
          - 77a7b25585c18af08f60b1547bb9b4fb  # CC
          - 36b72f59f4ea20aad9316f475f2d9fbb  # DCU
          - 89358767a60cc28783cdc3d0be9388a4  # DSNP
          - 7a235133c87f7da4c8cccceca7e3c7a6  # HBO
          - a880d6abc21e7c16884f3ae393f84179  # HMAX
          - f6cce30f1733d5c8194222a7507909bb  # HULU
          - 0ac24a2a68a9700bcb7eeca8e5cd644c  # iT
          - 81d1fbf600e2540cee87f3a23f9d3c1c  # MAX
          - d34870697c9db575f17700212167be23  # NF
          - 1656adc6d7bb2c8cca6acfb6592db421  # PCOK
          - c67a75ae4a1715f2bb4d492755ba4195  # PMTP
          - 6eb71887a8db6e783dd398446eb0e65d  # PLAY
          - da393fd4e2c0cce7c9dc2669c43e0593  # ROKU

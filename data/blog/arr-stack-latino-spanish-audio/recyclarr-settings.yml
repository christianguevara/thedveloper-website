# settings.yml (excerpt) — lets Recyclarr sync the local custom formats in ./custom-formats
resource_providers:
  - name: local-radarr
    type: custom-formats
    path: /config/custom-formats/radarr
    service: radarr
  - name: local-sonarr
    type: custom-formats
    path: /config/custom-formats/sonarr
    service: sonarr
